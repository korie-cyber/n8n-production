services:
  - type: web
    name: n8n-production
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: N8N_HOST
        value: n8n-production-1mw3.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PORT
        value: 5678
      - key: WEBHOOK_URL
        value: https://n8n-production-1mw3.onrender.com/
      - key: DB_TYPE
        value: sqlite
      - key: N8N_ENCRYPTION_KEY
        value: n8n-production-master-encryption-key-2026
      - key: N8N_DIAGNOSTICS_ENABLED
        value: false
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: false
      - key: NODE_FUNCTION_ALLOW_EXTERNAL
        value: pizzip,docxtemplater,xlsx
      - key: NODE_FUNCTION_ALLOW_BUILTIN
        value: https,fs,path
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: default
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
